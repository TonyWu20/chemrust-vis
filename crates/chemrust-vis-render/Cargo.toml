[package]
name = "chemrust-vis-render"
version.workspace = true
authors.workspace = true
edition.workspace = true
description = "File output for chemrust-vis: render a lattice frame to PNG or SVG"
repository.workspace = true
license.workspace = true

[[bin]]
name = "chemrust-vis-frame"
path = "src/main.rs"

[dependencies]
chemrust-vis-core = { path = "../chemrust-vis-core", features = ["castep-loader"] }
chemrust-geometry = { path = "../../../chemrust/chemrust-geometry" }
castep-periodic-table = "0.5.2"
nalgebra = "0.33"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = "0.25"

[dev-dependencies]
castep-cell-io = "0.7.0"
