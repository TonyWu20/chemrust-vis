[package]
name = "chemrust-vis-core"
description = "Core library for chemrust-vis: Scene, Camera, Viewport, and loading"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
chemrust-geometry = { path = "../../../chemrust/chemrust-geometry" }
nalgebra = "0.33"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Optional: CASTEP .cell file loader (feature-gated)
castep-cell-io = { version = "0.5", optional = true }
castep-cell-fmt = { version = "0.2", optional = true }

[dev-dependencies]
proptest = "1"

[features]
default = []
castep-loader = ["castep-cell-io", "castep-cell-fmt"]
