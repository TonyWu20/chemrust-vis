[package]
name = "chemrust-vis-tui"
description = "TUI binary for chemrust-vis: terminal 3D chemical structure viewer"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "chemrust-vis-tui"
path = "src/main.rs"

[dependencies]
chemrust-vis-core = { path = "../chemrust-vis-core", features = ["castep-loader"] }
ratatui = "0.29"
crossterm = "0.28"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Kitty transmission media: local shared memory (t=s) and zlib
# compression of the base64 path (o=z) for network sessions.
shared_memory = "0.12"
flate2 = "1"
